services:
  app:
    build: .
    image: trinket/app:latest
    ports:
      - 3000:3000
    container_name: trinket
    volumes:
      - .:/usr/local/node/trinket
      - node_modules:/usr/local/node/trinket/node_modules
      - public_components:/usr/local/node/trinket/public/components
      # public/css carries the two generated stylesheets, which are gitignored - so the bind mount above,
      # which replaces the whole image directory with the host checkout, would hide the copies the image
      # build produced. A named volume is initialized from the image on first use, so declaring one here
      # republishes the verified build output, exactly as node_modules and public/components are handled.
      # Like those two it is initialized ONCE: after changing static/scss/** or the component release,
      # recreate THIS ONE VOLUME and bring the stack up with `--build`:
      #
      #     docker compose down
      #     docker volume rm "${COMPOSE_PROJECT_NAME:-$(basename "$PWD")}_public_css"
      #     docker compose up --build
      #
      # Do NOT use `docker compose down -v` for it: `-v` removes EVERY volume declared below, including
      # `mongodb_data`, so it would delete the whole development database to refresh two stylesheets.
      - public_css:/usr/local/node/trinket/public/css
    networks:
      - trinket
    links:
      - redis
      - mongodb
  redis:
    image: redis:7.4
    # Published on the LOOPBACK interface only: an unqualified `16379:6379` binds 0.0.0.0, which puts
    # this unauthenticated Redis - the application cache and the background job queues - on every
    # interface of the host. `app` reaches Redis as `redis:6379` over the `trinket` bridge network
    # below, never through the published port, so confining it costs the application nothing; the port
    # exists only so a developer can attach `redis-cli`, and the host-side number is unchanged.
    #
    # Redis is NOT the session store: `app.js` registers the `sessions` cache against the in-repo
    # `lib/util/catbox-mongoose.js` engine, so server-side session records live in the `mongodb`
    # service below.
    ports:
      - 127.0.0.1:16379:6379
    container_name: redis
    networks:
      - trinket
  mongodb:
    image: mongo:6.0
    # Loopback-only for the same reason as `redis` above, and with the same zero application impact:
    # `app` reaches this service as `mongodb:27017` over the bridge network, not through the published
    # port. This is the datastore that matters for authentication - it holds every user record with its
    # bcrypt hash and, through the `sessions` cache `lib/util/catbox-mongoose.js` backs, every
    # server-side session record - so read access alone would be an authentication bypass. The
    # host-side port number is unchanged.
    ports:
      - 127.0.0.1:17017:27017
    container_name: mongodb
    volumes:
      - mongodb_data:/data/db
    networks:
      - trinket
networks:
  trinket:
    driver: bridge
volumes:
  shared-cache:
  node_modules:
  public_components:
  public_css:
  mongodb_data:
