services:
  # Nginx reverse proxy - single entry point
  nginx:
    build: ./nginx
    ports:
      - "8080:80"
      # Uncomment for SSL:
      # - "8443:443"
    volumes:
      - python-generated:/var/www/generated/python:ro
      - java-generated:/var/www/generated/java:ro
      - r-generated:/var/www/generated/r:ro
      - pygame-generated:/var/www/generated/pygame:ro
      # Uncomment for SSL certificates:
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on: []  # Will be populated by profiles

  # Python 3 - Manager 8100, Shell 8010 (both container-internal)
  # Every shell/worker image in this directory listens on 8010; only the
  # manager port differs per unit. On this network the shell is reached as
  # python3-shell:8010 (see the manager's config/production.json).
  python3-shell:
    build: ./python/shell
    profiles: ["python3"]
    # Internal only - no external port
    expose:
      - "8010"
    volumes:
      - python-sessions:/tmp/sessions
    # Production security options (uncomment for hardened deployment):
    # mem_limit: 500m
    # mem_reservation: 375m
    # cpus: 1.0
    # cpu_shares: 512
    # pids_limit: 50
    # read_only: true
    # tmpfs:
    #   - /tmp:size=100m

  python3-manager:
    build: ./python/manager
    profiles: ["python3"]
    # Internal only - nginx proxies to this
    expose:
      - "8100"
    volumes:
      - python-generated:/tmp/python-generated
    depends_on:
      - python3-shell
    environment:
      - NODE_ENV=production
      # GENERATED_URL must name the reverse proxy that actually serves the
      # generated volume, not the manager's own port: the manager only writes
      # the file into manager.generatedDir (the python-generated volume), and
      # nginx is what publishes it, from the same volume mounted read-only at
      # the /python3-generated/ alias. The manager hands this value straight
      # back to the browser as the file's `url`, so a URL pointing at the
      # manager (as config/default.json's local-development value does) is not
      # fetchable by anything. The variable lands on manager.generatedUrl
      # through the unit's config/custom-environment-variables.json mapping -
      # that file is the only reason the environment can reach this setting,
      # and it maps no other key (notably not `shells`, which is why the shell
      # URLs live in config/production.json instead). A deployment behind a
      # different host or scheme overrides this same variable, as
      # serverside/README.md documents.
      - GENERATED_URL=http://localhost:8080/python3-generated

  # Java - Manager 8200, Shell 8010 (both container-internal)
  # Reached as java-shell:8010 on this network; see java/manager/config/production.json.
  java-shell:
    build: ./java/shell
    profiles: ["java"]
    expose:
      - "8010"
    volumes:
      - java-sessions:/tmp/sessions
    # Production security options (uncomment for hardened deployment):
    # mem_limit: 500m
    # mem_reservation: 375m
    # cpus: 1.0
    # cpu_shares: 512
    # pids_limit: 50

  java-manager:
    build: ./java/manager
    profiles: ["java"]
    expose:
      - "8200"
    volumes:
      - java-generated:/tmp/java-generated
    depends_on:
      - java-shell
    environment:
      - NODE_ENV=production
      # The reverse proxy that serves the java-generated volume, not this
      # manager's own port - see the python3-manager note above for why, and
      # for the config/custom-environment-variables.json mapping that puts the
      # value on manager.generatedUrl.
      - GENERATED_URL=http://localhost:8080/java-generated

  # R - Manager 8300, Shell 8010 (both container-internal)
  # Reached as r-shell:8010 on this network; see r/manager/config/production.json.
  r-shell:
    build: ./r/shell
    profiles: ["r"]
    expose:
      - "8010"
    volumes:
      - r-sessions:/tmp/sessions
    # Production security options (uncomment for hardened deployment):
    # mem_limit: 500m
    # mem_reservation: 375m
    # cpus: 1.0
    # cpu_shares: 512
    # pids_limit: 50

  r-manager:
    build: ./r/manager
    profiles: ["r"]
    expose:
      - "8300"
    volumes:
      - r-generated:/tmp/r-generated
    depends_on:
      - r-shell
    environment:
      - NODE_ENV=production
      # The reverse proxy that serves the r-generated volume, not this
      # manager's own port - see the python3-manager note above for why, and
      # for the config/custom-environment-variables.json mapping that puts the
      # value on manager.generatedUrl.
      - GENERATED_URL=http://localhost:8080/r-generated

  # Pygame - Manager 8100, Worker 8010 + VNC 6080 (all container-internal)
  # The manager's port comes from pygame/manager/config/default.json, which sets
  # 8100; the 8400 this comment carried before is a port nothing binds.
  pygame-worker:
    build: ./pygame/worker
    profiles: ["pygame"]
    expose:
      - "8010"   # Shell socket.io
      - "6080"   # noVNC WebSocket
    volumes:
      - pygame-sessions:/tmp/pygame
    # Production security options (uncomment for hardened deployment):
    # mem_limit: 1g
    # mem_reservation: 750m
    # cpus: 2.0

  pygame-manager:
    build: ./pygame/manager
    profiles: ["pygame"]
    expose:
      - "8100"
    volumes:
      - pygame-generated:/tmp/pygame-generated
    depends_on:
      - pygame-worker
    environment:
      - NODE_ENV=production

volumes:
  python-sessions:
  python-generated:
  java-sessions:
  java-generated:
  r-sessions:
  r-generated:
  pygame-sessions:
  pygame-generated:
