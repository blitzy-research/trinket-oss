[program:novnc]
# Token- and Origin-checked proxy, replacing
# `websockify --web=/usr/share/novnc/ 6080 localhost:5900`, which proxied any
# connection from any origin to the unauthenticated desktop.
#   TokenFile     a connection must carry ?token=<value>; measured, a missing or
#                 unknown token is dropped. The token file also carries the
#                 127.0.0.1:5900 backend, so no positional target is passed.
#   ExpectOrigin  measured, a foreign or absent Origin gets 403 and an allowed
#                 one gets 101 and is proxied.
# --web is gone: GET / and /vnc.html now answer 405, so the bundled noVNC UI is
# no longer served. Nothing consumed it - the app loads its own client bundle
# (lib/views/embed/pygame.html).
# Both values come from ../entrypoint.sh via /run/pygame/vnc-env, which
# validates them. $VNC_WEBSOCKIFY_ORIGINS is the origin list in the
# whitespace-separated form ExpectOrigin parses (`src.split()`), and it is
# expanded INSIDE DOUBLE QUOTES so a multi-origin list stays one argument -
# unquoted, its second origin would be read as the port. The outer quoting is
# single so those inner quotes survive supervisor's own parse. `set -eu` makes a
# bypassed entrypoint fail closed: without /run/pygame/vnc-env this program
# aborts rather than starting a proxy with an empty origin list (measured: the
# empty expansion otherwise consumes the port argument and websockify exits
# "Too few arguments").
command=/bin/bash -c 'set -eu; . /run/pygame/vnc-env; exec /usr/bin/websockify --token-plugin TokenFile --token-source /run/pygame/websockify-tokens --auth-plugin ExpectOrigin --auth-source "$VNC_WEBSOCKIFY_ORIGINS" 6080'
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err.log
priority=200
