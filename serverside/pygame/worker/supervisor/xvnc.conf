[program:xvnc]
# -localhost keeps 5900 on loopback, so the desktop is reachable only through the
# websockify proxy in novnc.conf (measured: refused from the container's routable
# address with it, accepted without it). -ac is gone: it disabled X access
# control altogether, and with the empty ~/.vnc/passwd this server used to
# advertise RFB security type 1 (None), i.e. no authentication at all.
# $VNC_RFBAUTH_ARGS is written by ../entrypoint.sh and is empty unless
# VNC_PASSWORD was supplied; that file records why it is off by default.
# `set -eu` is what makes that fail closed: if /run/pygame/vnc-env is missing -
# the entrypoint was bypassed - this program aborts instead of quietly starting
# a server without the arguments it was meant to have.
command=/bin/bash -c "set -eu; . /run/pygame/vnc-env; exec /usr/bin/Xtightvnc :1 -rfbport 5900 -geometry 800x600 -depth 24 -localhost $VNC_RFBAUTH_ARGS"
user=trinket
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/xvnc.log
stderr_logfile=/var/log/supervisor/xvnc.err.log
priority=100
