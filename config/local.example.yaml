# Trinket Local Configuration
# Copy this file to local.yaml: cp config/local.example.yaml config/local.yaml
# IMPORTANT: Never commit local.yaml to version control

# =============================================================================
# REQUIRED
# =============================================================================

app:
  url:
    protocol: http
    hostname: localhost
    port: 3000

  plugins:
    session:
      cookieOptions:
        # CHANGE THIS. It must be at least 32 characters, and it must be SECRET: this value is the
        # key that seals and verifies every session cookie, so anyone who knows it can forge a
        # session for any account.
        #
        # The placeholder below is deliberately TOO SHORT, so app.js's startup guard rejects it and
        # the application refuses to boot until it is replaced. Length is the only check there is,
        # so a long placeholder would let a copy of this file boot with a published secret.
        #
        # Generate one instead of inventing one:
        #
        #     node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
        password: 'REPLACE_ME'
        domain: ''
        isSecure: false  # Set true in production with HTTPS

# =============================================================================
# DATABASE
# =============================================================================

db:
  mongo:
    host: mongodb      # Use 'mongodb' for Docker, 'localhost' for local
    port: 27017
    database: trinket

  # Redis is OPTIONAL - sessions work without it
  redis:
    enabled: false

# =============================================================================
# OPTIONAL: Email (for password reset)
# =============================================================================
# Without email, users can still register and log in, but password reset won't work.
#
# SECURITY - if you configure SMTP, set `secret` too. It is the signing key for the
# "share this trinket by email" token. There is no default for it, and when it is unset
# the effective key becomes the literal string "undefined" plus the trinket's PUBLIC
# short code - which anyone can read out of a trinket URL - so the token can be forged
# and the platform can be driven as a mail relay. Use a long random value, keep it out
# of version control, and see docs/PRESERVED-QUIRKS.md section 4.6 for the details and
# for why the application does not ship a default.

# app:
#   mail:
#     from: 'noreply@example.com'
#     host: 'smtp.example.com'
#     port: 587
#     user: 'your-smtp-username'
#     pass: 'your-smtp-password'
#     secret: 'change-me-to-a-long-random-value'

# =============================================================================
# OPTIONAL: File Storage (for asset uploads in trinkets)
# =============================================================================
# Without S3, the asset upload feature is disabled. Code still works fine.

# features:
