services:
  app:
    build: .
    image: trinket/app:latest
    ports:
      - 3000:3000
    container_name: trinket
    volumes:
      - .:/usr/local/node/trinket
      - node_modules:/usr/local/node/trinket/node_modules
      - public_components:/usr/local/node/trinket/public/components
      # public/css carries the two generated stylesheets, and they are gitignored - so the bind mount
      # above, which replaces the whole image directory with the host checkout, hides the copies the image
      # build produced and a clean clone ends up serving no stylesheet at all. Docker initializes an EMPTY
      # named volume from whatever the image holds at that path on first use, so declaring one here
      # republishes the verified build output through the bind mount, exactly as node_modules and
      # public/components are already handled. Like those two, the volume is initialized ONCE: after
      # changing static/scss/** or the component release, recreate THIS ONE VOLUME and bring the stack up
      # with `--build`:
      #
      #     docker compose down
      #     docker volume rm "${COMPOSE_PROJECT_NAME:-$(basename "$PWD")}_public_css"
      #     docker compose up --build
      #
      # Do NOT use `docker compose down -v` for it. `-v` removes EVERY volume declared below, including
      # `mongodb_data` - the MongoDB data directory - so it would delete the whole development database to
      # refresh two stylesheets, with no prompt and no recovery. An earlier revision of this comment
      # offered `down -v` as the first option, and README.md and docs/setup.md repeated it; the safe,
      # targeted form above is the only one any of the three now documents (review finding P3-3).
      - public_css:/usr/local/node/trinket/public/css
    networks:
      - trinket
    links:
      - redis
      - mongodb
  redis:
    image: redis:7.4
    # Published on the LOOPBACK interface only. `16379:6379` binds 0.0.0.0, which put an
    # unauthenticated Redis - the session store - on every interface of the host, reachable
    # by anyone who could route to it; read access to it is a full authentication bypass,
    # because the sealed session records live there (review finding SV-28).
    #
    # This costs the application nothing: `app` reaches Redis as `redis:6379` over the
    # `trinket` bridge network below, never through the published port. The published port
    # exists purely so a developer on the host can attach `redis-cli`, and 127.0.0.1 serves
    # that identically. The host-side port number is unchanged, so every documented
    # `redis-cli -p 16379` invocation keeps working.
    ports:
      - 127.0.0.1:16379:6379
    container_name: redis
    networks:
      - trinket
  mongodb:
    image: mongo:6.0
    # Loopback-only for the same reason as `redis` above, and with the same zero
    # application impact: `app` reaches this service as `mongodb:27017` over the bridge
    # network, not through the published port. Unbound, `17017:27017` exposed an
    # unauthenticated MongoDB holding every user record - including the bcrypt password
    # hashes - on all host interfaces (review finding SV-28). The host-side port number is
    # unchanged, so `mongosh --port 17017` still works from the host.
    ports:
      - 127.0.0.1:17017:27017
    container_name: mongodb
    volumes:
      - mongodb_data:/data/db
    networks:
      - trinket
networks:
  trinket:
    driver: bridge
volumes:
  shared-cache:
  node_modules:
  public_components:
  public_css:
  mongodb_data:
